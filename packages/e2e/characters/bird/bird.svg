<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <!-- Second reference character (plan Task 24): deliberately unlike the
       teacher. Every slot is a top-level group so `character import` can
       scaffold it; the semantic FK hierarchy lives only in character.json. -->
  <g id="body">
    <ellipse cx="160" cy="190" rx="58" ry="43" fill="#2f7f78" />
    <ellipse cx="176" cy="195" rx="32" ry="24" fill="#52a79d" />
  </g>

  <g id="neck">
    <path
      d="M146 174 C140 150 142 126 153 108 L174 112 C164 135 165 157 174 178 Z"
      fill="#4b9a91"
    />
  </g>

  <g id="head">
    <circle cx="166" cy="105" r="34" fill="#64b8ad" />
    <circle cx="177" cy="96" r="5" fill="#172554" />
  </g>

  <g id="beak">
    <polygon points="197,104 244,118 198,128" fill="#e6a700" />
    <line x1="201" y1="117" x2="235" y2="118" stroke="#9a6200" stroke-width="3" />
  </g>

  <!-- Mangled like a real design-tool export. The scaffold turns the slot id
       into `wing-front`; bind preserves this source id in the mapping table. -->
  <g id="wing_x5F_front">
    <path
      d="M142 181 C104 151 75 163 62 201 C91 194 118 211 145 225 Z"
      fill="#285f69"
    />
    <path d="M128 188 L78 192" stroke="#8bd0c7" stroke-width="5" />
  </g>

  <g id="tail">
    <polygon points="110,195 54,177 76,214" fill="#244f5a" />
  </g>

  <g id="leg">
    <rect x="155" y="222" width="10" height="57" rx="5" fill="#cc8a24" />
  </g>

  <g id="foot">
    <path d="M160 274 L137 291 M160 274 L181 291" stroke="#9a6200" stroke-width="7" stroke-linecap="round" />
  </g>

  <circle id="pivot-body" cx="160" cy="190" r="1" fill="#ff00ff" />
  <circle id="pivot-neck" cx="160" cy="174" r="1" fill="#ff00ff" />
  <circle id="pivot-head" cx="166" cy="105" r="1" fill="#ff00ff" />
  <circle id="pivot-beak" cx="198" cy="117" r="1" fill="#ff00ff" />
  <circle id="pivot-wing-front" cx="142" cy="190" r="1" fill="#ff00ff" />
  <circle id="pivot-tail" cx="110" cy="195" r="1" fill="#ff00ff" />
  <circle id="pivot-leg" cx="160" cy="224" r="1" fill="#ff00ff" />
  <circle id="pivot-foot" cx="160" cy="274" r="1" fill="#ff00ff" />
</svg>
